<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        ComicCraft
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<header class="topbar">

    <a
        href="/"
        class="brand"
    >
        Comic<span>Craft</span>
    </a>


    <a
        href="/docs"
        class="docs-link"
    >
        API Docs
    </a>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<script
    src="/static/js/app.js"
></script>

</body>

</html>
